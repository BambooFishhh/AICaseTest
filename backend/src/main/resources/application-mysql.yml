# v5.0: MySQL profile（Flyway 管理 schema，JPA 不自动建表）
spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3308/aicasetest?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:aicasetest}
    password: ${MYSQL_PASSWORD:aicasetest123}
    # v5.7: Hikari 连接池调优（异步执行/生成场景需要更高并发连接）
    # v8.9.2(12.1): 池容量与任务线程池对齐——analysis 6 + generation 6 + execution 12 + semantic 2
    # = 26 任务线程，叠加 HTTP 短请求并发；40 ≥ 26+余量，避免高峰期任务线程阻塞在连接获取
    # （MySQL 侧 max-connections=200 可容纳多实例 × 40）。泄漏检测 60s：超时借出打印 WARN 堆栈。
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:40}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      leak-detection-threshold: ${HIKARI_LEAK_DETECTION_MS:60000}
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    baseline-on-migrate: true
  h2:
    console:
      enabled: false
server:
  port: 8000
app:
  output-dir: outputs
  projects-dir: projects
logging:
  level:
    com.testagent: INFO
    org.hibernate.SQL: WARN
