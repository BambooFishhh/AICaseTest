# v5.0/v5.5: 生产 profile 通过 spring.profiles.group 自动带入 mysql
# 生产环境正式启用 Redis 运行态 + Milvus 语义检索
app:
  redis:
    enabled: ${APP_REDIS_ENABLED:true}
  milvus:
    enabled: ${APP_MILVUS_ENABLED:true}
    # vP1: Milvus 启用鉴权时使用独立账号连接
    username: ${MILVUS_USERNAME:root}
    password: ${MILVUS_PASSWORD:}
  # vP1: 生产强制校验自定义 JWT Secret / 管理员密码，失败直接阻断启动
  security:
    enforce: ${APP_ENFORCE_SECURITY:true}
# v6.0: 生产 Spring AI 配置（保留原有 LLM_* 环境变量映射）
spring:
  ai:
    openai:
      api-key: ${LLM_API_KEY:}
      base-url: ${LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
      # v6.0fix: 与 application.yml 一致，覆盖端点路径避免 /v1/v1 重复
      chat:
        completions-path: /chat/completions
        options:
          model: ${LLM_MODEL:glm-5.3-flash}
      embedding:
        api-key: ${LLM_EMBEDDING_API_KEY:${DASHSCOPE_API_KEY:${LLM_API_KEY:}}}
        # v7.14(E17): 默认端点改 DashScope 兼容模式（chat 网关无 embeddings 路由，回落=404）
        base-url: ${LLM_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        embeddings-path: /embeddings
        options:
          model: ${LLM_EMBEDDING_MODEL:text-embedding-v4}
llm:
  provider: ${LLM_PROVIDER:openai}
  model: ${LLM_MODEL:glm-5.3-flash}
  api-key: ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
