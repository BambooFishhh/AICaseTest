server:
  port: 8000
  # vP2: 优雅停机，等待进行中任务结束
  shutdown: graceful
spring:
  # vP2: 优雅停机最长等待 30s
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # v6.0fix: Spring AI OpenAI 长推理请求需更长 HTTP 超时，避免 Total timeout 10s 超时
  http:
    client:
      # v6.1fix: 强制 JDK 客户端，规避 Jetty 默认 30s idle timeout（Spring AI RestClient 会自建 Jetty，自定义 bean 不生效）
      factory: simple
      connect-timeout: 30s
      read-timeout: 900s
  # v5.0/v5.5: profile 组——prod/migrate 自动带入 mysql
  profiles:
    group:
      prod: mysql
      migrate: mysql
  datasource:
    url: jdbc:h2:file:./data/appdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # vP1: 上传大小全局限制（Nginx 之外的后端二次防线）
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:20MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:20MB}
  # v5.0: H2 开发环境不启用 Flyway，schema 继续由 JPA 管理
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  # v5.2: Redis 连接配置
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  # v6.0: Spring AI 主线使用 OpenAI starter（DashScope OpenAI 兼容端点）
  ai:
    openai:
      api-key: ${LLM_API_KEY:}
      base-url: ${LLM_BASE_URL:https://opencode.ai/zen/go/v1}
      # v6.0fix: LLM_BASE_URL 以 /v1 结尾（MCP vision 的 OpenAI SDK 语义）。
      # Spring AI 会额外拼路径，因此显式覆盖为不带 /v1 的端点路径，避免 /v1/v1 重复。
      chat:
        completions-path: /chat/completions
        options:
          model: ${LLM_MODEL:mimo-v2.5}
          temperature: 0.4
      embedding:
        api-key: ${LLM_EMBEDDING_API_KEY:${DASHSCOPE_API_KEY:${LLM_API_KEY:}}}
        # v7.14(E17): 默认端点改 DashScope 兼容模式——原默认回落 chat 网关(opencode.ai/zen/go/v1)，
        # 该网关无 embeddings 路由必然 404，RAG 检索持续降级为空。不再回落 LLM_BASE_URL
        base-url: ${LLM_EMBEDDING_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        embeddings-path: /embeddings
        options:
          # v7.14(E17): qwen3.7-text-embedding → text-embedding-v4（DashScope 兼容端点模型名，
          # 默认 1024 维 = Milvus 集合默认维度）
          model: ${LLM_EMBEDDING_MODEL:text-embedding-v4}
llm:
  provider: ${LLM_PROVIDER:bailian}
  model: ${LLM_MODEL:mimo-v2.5}
  embedding-model: ${LLM_EMBEDDING_MODEL:text-embedding-v4}
  enable-thinking: ${LLM_ENABLE_THINKING:false}
  # v7.10(L3): thinking 为咨询性配置——Spring AI OpenAI starter 无法透传 enable_thinking，
  # 开启后不生效（启动时会输出 warn 日志提醒）；LLM_ENABLE_THINKING 仅对 MCP 多模态链路有意义
  thinking:
    analysis: ${LLM_THINKING_ANALYSIS:true}
    generation: ${LLM_THINKING_GENERATION:false}
  api-key: ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:https://opencode.ai/zen/go/v1}
  # v6.7: provider 简易熔断（连续失败短路）
  circuit:
    failure-threshold: ${LLM_CIRCUIT_FAILURE_THRESHOLD:5}
    open-seconds: ${LLM_CIRCUIT_OPEN_SECONDS:30}
  # v6.1 (B 方案): 统一 prompt 上限，避免 277KB 超大 prompt 触发 Idle timeout/超时
  # v7.13: 60000 → 300000（128k context 模型）；v8.4: → 500000 适配 256k context 模型
  #（500k chars ≈ 170-220k tokens，预留 ≥32k 输出；触发即 ERROR，说明上游预算失效）
  max-prompt-chars: ${LLM_MAX_PROMPT_CHARS:500000}
  # v7.3(L8): 输出上限；v8.4: 16384 → 32768——单轮高密度用例（20+ 条）易顶满输出上限
  # 导致流式 JSON 截断（虽有 L8 局部补全抢救，但字段可能不完整）
  max-tokens: ${LLM_MAX_TOKENS:32768}
  # v6.5: LLM 重试次数（分类 + 抖动，4xx 不重试）
  retry:
    max-attempts: ${LLM_RETRY_MAX_ATTEMPTS:3}
  # v8.4fix: 流式调用流级总超时看门狗（毫秒）——底层心跳保活时 read-timeout 不触发，
  # 超过该时长主动中断并按超时可重试分类处理，防止挂死流永久占用线程与 SSE 连接
  stream-total-timeout-ms: ${LLM_STREAM_TOTAL_TIMEOUT_MS:900000}
  # v7.13: 移除死配置 llm.max-context-chars——v6.1 登记后从未被任何 @Value 读取，
  # 生成侧实际截断由 TestGeneratorAgent.truncateStrings/truncateDocs 承担（G17 相关性过滤管理）
  # v6.1: Spring AI HTTP 客户端超时（自定义 ClientHttpRequestFactory，覆盖 Jetty 默认 30s idle）
  http:
    connect-timeout-ms: ${LLM_CONNECT_TIMEOUT_MS:30000}
    read-timeout-ms: ${LLM_READ_TIMEOUT_MS:600000}
app:
  output-dir: outputs
  projects-dir: projects
  # v7.13: 分析器 LLM 增强输入预算——原 v6.1 时代硬编码（16k/1500/30k/12k/800/700）
  # 按 32k context 模型定的保守值。修正后按"大项目全覆盖"定参：
  # Spring 120k≈30-40 文件、单文件 10k 完整覆盖绝大多数类；
  # Vue 96k≈20-30 组件、单组件 6k 完整覆盖典型 SFC。
  # 全部可环境变量覆盖，模型小可回调；超大项目结构性方案见 docs/大项目代码分析演进提案.md
  analyzer:
    spring-source-total-chars: ${APP_ANALYZER_SPRING_SOURCE_TOTAL_CHARS:120000}
    spring-source-per-file-chars: ${APP_ANALYZER_SPRING_SOURCE_PER_FILE_CHARS:10000}
    rule-summary-max-chars: ${APP_ANALYZER_RULE_SUMMARY_MAX_CHARS:80000}
    vue-source-total-chars: ${APP_ANALYZER_VUE_SOURCE_TOTAL_CHARS:96000}
    vue-template-chars: ${APP_ANALYZER_VUE_TEMPLATE_CHARS:3000}
    vue-script-chars: ${APP_ANALYZER_VUE_SCRIPT_CHARS:3000}
  # v8.4: PRD 需求解析入口截断预算（适配 256k context 模型）——旧硬编码 12000/24000，
  # 此处截断直接丢需求条目（覆盖率根因之一）；单文档 40k、总量 96k 仍保留头尾各半策略。
  # 模型上下文小时可回调（128k 模型建议 12000/24000）
  prd:
    doc-max-chars: ${APP_PRD_DOC_MAX_CHARS:40000}
    total-max-chars: ${APP_PRD_TOTAL_MAX_CHARS:96000}
  # v8.4: 生成侧 prompt 上下文预算（适配 256k context 模型，全部可环境变量回调）
  generation:
    # 接口/规则完整详情容量（相关性过滤后的 top-N）
    endpoints-context-max: ${APP_GEN_ENDPOINTS_CONTEXT_MAX:160}
    rules-context-max: ${APP_GEN_RULES_CONTEXT_MAX:150}
    # RAG 检索切片与失败经验注入（单条字符数 × 条数）
    rag-context-chars: ${APP_GEN_RAG_CONTEXT_CHARS:2000}
    rag-context-count: ${APP_GEN_RAG_CONTEXT_COUNT:8}
    rag-failure-chars: ${APP_GEN_RAG_FAILURE_CHARS:1200}
    rag-failure-count: ${APP_GEN_RAG_FAILURE_COUNT:5}
    # PRD/上下文文档原文注入（单文档字符数 × 文档数）
    doc-content-chars: ${APP_GEN_DOC_CONTENT_CHARS:12000}
    doc-count: ${APP_GEN_DOC_COUNT:5}
    # coverageChecklist.endpoints 注入上限（摘要条目，单条成本低）
    checklist-endpoints-cap: ${APP_GEN_CHECKLIST_ENDPOINTS_CAP:250}
    # coverageGaps 各维度 id 列表统一上限（纯 id，成本极低）
    gaps-cap-limit: ${APP_GEN_GAPS_CAP_LIMIT:150}
    # v8.4: 单项目生成用例总量上限 60 → 120（60 只够中小项目）；
    # 实际总量还受补齐轮次（3~4 轮）约束，两者先到者生效
    max-generated-cases: ${APP_GEN_MAX_GENERATED_CASES:120}
  # Git URL 项目克隆目录与超时
  git:
    clone-dir: ${GIT_CLONE_DIR:data/git-repos}
    clone-timeout-seconds: ${GIT_CLONE_TIMEOUT_SECONDS:600}
  # v5.13fix: SSE 长连接超时（生成/分析包含多次 LLM 调用，可能远超 5 分钟）
  sse:
    timeout-minutes: ${APP_SSE_TIMEOUT_MINUTES:30}
    # v6.6: SSE 短期票据 TTL（秒），避免长期 JWT 出现在 URL
    ticket-ttl-seconds: ${APP_SSE_TICKET_TTL_SECONDS:300}
  # v6.5: 高可用任务租约与恢复
  ha:
    task-lease-seconds: ${APP_HA_TASK_LEASE_SECONDS:600}
    recovery-cron: ${APP_HA_RECOVERY_CRON:0 */5 * * * *}
    # v6.6: 任务 TTL 与 QUEUED 兜底调度
    task-ttl-minutes: ${APP_HA_TASK_TTL_MINUTES:60}
    ttl-cron: ${APP_HA_TTL_CRON:0 */10 * * * *}
    dispatch-delay-ms: ${APP_HA_DISPATCH_DELAY_MS:15000}
  # v6.6: 业务组件判定口径（Analyzer/Generator 共用）
  business:
    llm-summary-threshold: ${APP_BUSINESS_LLM_SUMMARY_THRESHOLD:0.3}
    coverage-threshold: ${APP_BUSINESS_COVERAGE_THRESHOLD:0.0}
  # vP1: 上传文件大小二次校验（字节，与 multipart 配置保持一致）
  upload:
    max-size: ${MAX_UPLOAD_SIZE_BYTES:20971520}
  # v8.4fix: 目录选择器可浏览根目录白名单（逗号分隔），禁止枚举服务器全盘目录
  filesystem:
    browse-roots: ${APP_FS_BROWSE_ROOTS:${app.projects-dir:projects},${app.git.clone-dir:data/git-repos}}
  # vP1: 生产安全强制开关（prod 默认 true，本地开发默认 false）
  security:
    enforce: ${APP_ENFORCE_SECURITY:false}
  # v5.2: Redis 运行态（取消标志/心跳/并发配额/防爆破），默认关闭走内存
  redis:
    enabled: ${APP_REDIS_ENABLED:false}
  # v5.4: Milvus 语义检索
  milvus:
    enabled: ${APP_MILVUS_ENABLED:false}
    host: ${MILVUS_HOST:localhost}
    port: ${MILVUS_PORT:19530}
    username: ${MILVUS_USERNAME:root}
    # v8.5: 密钥必填（SecurityKeyGuard 全 profile 校验），缺失即启动失败
    password: ${MILVUS_PASSWORD}
    dimension: ${MILVUS_DIMENSION:1024}
    duplicate-threshold: ${MILVUS_DUPLICATE_THRESHOLD:0.92}
  # v6.4: RAG 切片与多路检索
  rag:
    chunk-size: ${RAG_CHUNK_SIZE:500}
    chunk-overlap: ${RAG_CHUNK_OVERLAP:150}
    rrf-k: ${RAG_RRF_K:60}
    context-topk: ${RAG_CONTEXT_TOPK:6}
    failure-topk: ${RAG_FAILURE_TOPK:3}
    max-queries: ${RAG_MAX_QUERIES:12}
  # vT6: 测试环境可关闭 MCP 子进程
  mcp:
    enabled: ${APP_MCP_ENABLED:true}
    bridge-url: ${MCP_BRIDGE_URL:http://127.0.0.1:8000}
    # v8.5: 桥接 token 必填（SecurityKeyGuard 全 profile 校验），缺失即启动失败
    bridge-token: ${MCP_BRIDGE_TOKEN}
    # v8.5: /api/mcp/** 来源白名单——默认仅回环，反代部署可注入额外 IP（逗号分隔）
    allowed-remote-addrs: ${APP_MCP_ALLOWED_REMOTE_ADDRS:}
    # v6.6: MCP 工具请求超时（秒），超时抛 TOOL_TIMEOUT 并支持幂等工具重试
    request-timeout-seconds: ${APP_MCP_REQUEST_TIMEOUT_SECONDS:60}
  # v5.8: 数据保留策略（0=关闭）
  retention:
    execution-days: ${RETENTION_EXECUTION_DAYS:0}
    cron: ${RETENTION_CRON:0 0 3 * * *}
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}
  # v4.0: JWT 与默认管理员配置
  jwt:
    # v8.5: 必填（SecurityKeyGuard 全 profile 校验），缺失即启动失败；prod 强度检查见 ProductionGuard
    secret: ${APP_JWT_SECRET}
    expiration-hours: ${APP_JWT_EXPIRATION_HOURS:12}
  admin:
    # v8.5: 必填（SecurityKeyGuard 全 profile 校验），缺失即启动失败
    password: ${APP_ADMIN_PASSWORD}
  # v7.9(E10): 复制执行权限收敛——false 保持 VIEW 即可（v4.3 现状）；true 要求 OPERATE
  execution:
    copy-execute-require-operate: ${APP_COPY_EXECUTE_REQUIRE_OPERATE:false}
  # v4.2: 线程池与并发配额
  executor:
    keep-alive-seconds: ${EXECUTOR_KEEP_ALIVE_SECONDS:60}
    await-termination-seconds: ${EXECUTOR_AWAIT_TERMINATION_SECONDS:30}
    # v7.9(E7): 项目执行并发配额排队超时（分钟）。超时该条执行记 failed；<=0 禁用（旧行为无限等待）
    project-acquire-timeout-minutes: ${EXECUTOR_PROJECT_ACQUIRE_TIMEOUT_MINUTES:30}
    analysis:
      core: ${EXECUTOR_ANALYSIS_CORE:2}
      max: ${EXECUTOR_ANALYSIS_MAX:6}
      queue: ${EXECUTOR_ANALYSIS_QUEUE:50}
    generation:
      core: ${EXECUTOR_GENERATION_CORE:2}
      max: ${EXECUTOR_GENERATION_MAX:6}
      queue: ${EXECUTOR_GENERATION_QUEUE:50}
    execution:
      core: ${EXECUTOR_EXECUTION_CORE:4}
      max: ${EXECUTOR_EXECUTION_MAX:12}
      queue: ${EXECUTOR_EXECUTION_QUEUE:500}
    semantic:
      core: ${EXECUTOR_SEMANTIC_CORE:1}
      max: ${EXECUTOR_SEMANTIC_MAX:2}
      queue: ${EXECUTOR_SEMANTIC_QUEUE:100}
    # v6.2: 前端逐组件 LLM 增强的并发上限（越大越快，注意模型限流）
    llm-concurrency: ${EXECUTOR_LLM_CONCURRENCY:4}
    project-execution-max: ${PROJECT_EXECUTION_MAX:5}
# v2.6: MCP 多 Server 配置
mcp:
  servers:
    llm:
      node-path: ${MCP_NODE_PATH:node}
      script-path: mcp-server/index.js
    playwright:
      node-path: ${MCP_NODE_PATH:node}
      script-path: playwright-mcp-server/index.js
    tools:
      node-path: ${MCP_NODE_PATH:node}
      script-path: tools-mcp-server/index.js
logging:
  level:
    com.testagent: INFO
    org.hibernate.SQL: WARN

# vT4: 运维可观测——健康/信息/指标/Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
