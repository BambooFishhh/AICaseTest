name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend tests
        run: mvn -B verify
      - name: Show surefire reports on failure
        if: failure()
        run: |
          find target/surefire-reports -name '*.txt' -exec cat {} + || true
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          # 锁文件在 frontend/ 下，需显式指定缓存路径
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build

  compose:
    name: Docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        env:
          # v8.5(8.2)/v8.9.1(12.3): compose 必填凭据在 CI 仅注入占位值做语法校验；
          # 生产部署由 .env 提供真实强密码（不入库）。新增必填变量时同步维护此清单。
          GRAFANA_ADMIN_PASSWORD: ci-placeholder-not-for-login
          MYSQL_ROOT_PASSWORD: ci-placeholder
          MYSQL_PASSWORD: ci-placeholder
          REDIS_PASSWORD: ci-placeholder
          MILVUS_ROOT_PASSWORD: ci-placeholder
          MINIO_ACCESS_KEY: ci-placeholder-access
          MINIO_SECRET_KEY: ci-placeholder-secret
          MCP_BRIDGE_TOKEN: ci-placeholder-token
        run: docker compose config --quiet

  security:
    name: Secret scan & dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: npm audit (production deps)
        working-directory: frontend
        run: |
          NANOID_VERSION=$(node -p 'require("./node_modules/nanoid/package.json").version')
          echo "installed nanoid: $NANOID_VERSION"
          npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: aicasetest-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: aicasetest-frontend:ci
