groups:
  - name: aicasetest-slo
    rules:
      - alert: AICaseTestBackendDown
        expr: up{job="aicasetest-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "AICaseTest backend down"
          description: "Prometheus 已连续 2 分钟无法抓取后端指标。"

      - alert: AICaseTestHighErrorRate
        expr: |
          sum(rate(aicasetest_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(aicasetest_http_requests_total[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AICaseTest 5xx 错误率过高"
          description: "5 分钟内 5xx 请求占比超过 5%。"

      - alert: AICaseTestP95LatencyHigh
        expr: |
          histogram_quantile(0.95,
            sum(rate(aicasetest_http_requests_duration_seconds_bucket[5m])) by (le)) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "AICaseTest P95 延迟过高"
          description: "近 5 分钟 P95 请求耗时超过 3 秒。"

      - alert: AICaseTestQueueBacklogHigh
        expr: aicasetest_queue_queued > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AICaseTest 任务队列积压"
          description: "生成/执行队列 queued 数量超过 20。"

      - alert: AICaseTestDlqNonEmpty
        expr: aicasetest_task_dlq_total > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AICaseTest 存在死信任务"
          description: "agent_task 存在 DLQ 状态任务，需到任务中心处理。"

      - alert: AICaseTestTaskFailureRateHigh
        expr: |
          sum(rate(aicasetest_task_failed_total[10m]))
            / clamp_min(sum(rate(aicasetest_task_started_total[10m])), 1) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "AICaseTest 任务失败率过高"
          description: "近 10 分钟任务失败率超过 20%。"

  # ========== v8.7.2(9.5.5): 生成质量与数据一致性告警 ==========
  - name: aicasetest-generation-quality
    rules:
      - alert: AICaseTestVectorPendingOpsStuck
        expr: vector_pending_ops_size > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "向量补偿积压超过 1 小时未清零"
          description: "pending_vector_ops 存在 PENDING 记录持续 1h，Milvus 删除失败未被重放成功，需检查 Milvus 健康与补偿任务日志。"

      - alert: AICaseTestParseSkipRatioHigh
        expr: |
          rate(gen_parse_skipped_total[10m])
            / clamp_min(rate(gen_cases_generated_total[10m]) + rate(gen_parse_skipped_total[10m]), 0.001) > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "生成解析跳过率超过 30%"
          description: "10 分钟窗口内畸形用例条目占比超 30%，LLM 输出格式劣化，建议检查模型版本与 llm.schema.mode 灰度数据。"

      - alert: AICaseTestExecutorRejected
        expr: increase(executor_rejected_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "线程池发生饱和拒绝"
          description: "5 分钟内出现 analysis/generation 池拒绝（用户已收到繁忙提示），考虑调大 EXECUTOR_*_QUEUE 或扩容。"

      # ========== v8.8.2(10.5): 任务积压告警 ==========
      - alert: AICaseTestRunningBacklogHigh
        expr: agent_task_running > 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "RUNNING 任务积压超过 15 分钟"
          description: "agent_task RUNNING 数量持续高于 5，执行/生成链路可能出现堆积或租约泄漏，请检查任务中心与线程池指标。"

      - alert: AICaseTestQueueStarved
        expr: agent_task_queued > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "QUEUED 任务超过 20 持续 10 分钟"
          description: "排队任务未被及时分发，检查 dispatchQueuedTasks 调度与执行池容量。"
