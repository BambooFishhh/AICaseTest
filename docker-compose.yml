services:
  # ========== 后端 ==========
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: test-agent-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-mimo}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-mimo-v2.5-pro}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.xiaomimimo.com/v1}
      - TZ=Asia/Shanghai
      - JAVA_OPTS=-Xms256m -Xmx2g -Dfile.encoding=UTF-8
    volumes:
      # H2 数据库持久化
      - ./data:/app/data
      # XMind 输出文件
      - ./outputs:/app/outputs
      # 待分析项目代码（只读挂载 litemall）
      - E:/java_project/litemall:/app/projects/litemall:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ========== 前端 ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: test-agent-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
