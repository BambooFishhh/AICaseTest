services:
  # ========== v5.0: MySQL 数据库（3308 避开本机 3306/3307） ==========
  mysql:
    image: mysql:8.0
    container_name: aicasetest-mysql
    restart: unless-stopped
    stop_grace_period: 30s
    # vP2: 资源限制与优雅停机
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "2.0"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-aicasetest-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-aicasetest}
      - MYSQL_USER=${MYSQL_USERNAME:-aicasetest}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-aicasetest123}
      - TZ=Asia/Shanghai
    # vP1: 仅本机可访问，容器间通过内部网络互连
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3308}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --max-connections=200
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-aicasetest-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ========== v5.2: Redis 运行态 ==========
  redis:
    image: redis:7-alpine
    container_name: aicasetest-redis
    restart: unless-stopped
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    # vP1: 强制 AUTH + protected-mode，端口仅绑定本机
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-aicasetest-redis}", "--protected-mode", "yes"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-aicasetest-redis}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========== v5.4: Milvus 语义检索（standalone = etcd + minio + milvus） ==========
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: aicasetest-etcd
    restart: unless-stopped
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    image: minio/minio:latest
    container_name: aicasetest-minio
    restart: unless-stopped
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: aicasetest-milvus
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ADDRESS=minio:9000
      # vP1: Milvus 鉴权（生产建议开启并修改默认口令）
      - COMMON_SECURITY_AUTHORIZATIONENABLED=${MILVUS_AUTH_ENABLED:-true}
      - COMMON_SECURITY_ROOTPASSWORD=${MILVUS_ROOT_PASSWORD:-aicasetest-milvus}
    ports:
      - "127.0.0.1:${MILVUS_PORT:-19530}:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 12

  # ========== 后端 ==========
  backend:
    # vP4: 支持本地构建与 GHCR 镜像部署（IMAGE_TAG 控制版本）
    image: ${IMAGE_BACKEND:-aicasetest-backend}:${IMAGE_TAG:-local}
    pull_policy: ${PULL_POLICY:-missing}
    build:
      # 需要仓库根作为上下文，以复制 mcp-server / playwright-mcp-server
      context: .
      dockerfile: backend/Dockerfile
    container_name: test-agent-backend
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    ports:
      - "8000:8000"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # v6.0: LLM_* 同时注入 Spring AI（chat/stream/embedding）与保留的 vision MCP
      - LLM_PROVIDER=${LLM_PROVIDER:-bailian}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-mimo-v2.5}
      - EXECUTOR_LLM_CONCURRENCY=${EXECUTOR_LLM_CONCURRENCY:-4}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://opencode.ai/zen/go/v1}
      - LLM_EMBEDDING_MODEL=${LLM_EMBEDDING_MODEL:-qwen3.7-text-embedding}
      - LLM_ENABLE_THINKING=${LLM_ENABLE_THINKING:-false}
      - LLM_THINKING_ANALYSIS=${LLM_THINKING_ANALYSIS:-true}
      - LLM_THINKING_GENERATION=${LLM_THINKING_GENERATION:-false}
      # v6.5: LLM 重试次数（分类 + 抖动）
      - LLM_RETRY_MAX_ATTEMPTS=${LLM_RETRY_MAX_ATTEMPTS:-3}
      # v6.1 (B 方案): 统一 prompt 上限与 LLM HTTP 超时
      - LLM_MAX_PROMPT_CHARS=${LLM_MAX_PROMPT_CHARS:-60000}
      - LLM_MAX_CONTEXT_CHARS=${LLM_MAX_CONTEXT_CHARS:-24000}
      - LLM_CONNECT_TIMEOUT_MS=${LLM_CONNECT_TIMEOUT_MS:-30000}
      - LLM_READ_TIMEOUT_MS=${LLM_READ_TIMEOUT_MS:-600000}
      # v5.5: 正式切换 MySQL + Redis + Milvus
      - MYSQL_URL=jdbc:mysql://aicasetest-mysql:3306/aicasetest?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      - MYSQL_USERNAME=${MYSQL_USERNAME:-aicasetest}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-aicasetest123}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-aicasetest-redis}
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - MILVUS_USERNAME=root
      - MILVUS_PASSWORD=${MILVUS_ROOT_PASSWORD:-aicasetest-milvus}
      # v6.4: RAG 切片与多路检索
      - RAG_CHUNK_SIZE=${RAG_CHUNK_SIZE:-900}
      - RAG_CHUNK_OVERLAP=${RAG_CHUNK_OVERLAP:-150}
      - RAG_RRF_K=${RAG_RRF_K:-60}
      - RAG_CONTEXT_TOPK=${RAG_CONTEXT_TOPK:-6}
      - RAG_FAILURE_TOPK=${RAG_FAILURE_TOPK:-3}
      - RAG_MAX_QUERIES=${RAG_MAX_QUERIES:-12}
      - APP_REDIS_ENABLED=true
      - APP_MILVUS_ENABLED=true
      - APP_ENFORCE_SECURITY=${APP_ENFORCE_SECURITY:-true}
      - APP_JWT_SECRET=${APP_JWT_SECRET:-}
      - APP_ADMIN_PASSWORD=${APP_ADMIN_PASSWORD:-}
      # v5.13fix: SSE 长连接超时（分钟），需与 frontend/nginx.conf proxy timeout 对齐
      - APP_SSE_TIMEOUT_MINUTES=${APP_SSE_TIMEOUT_MINUTES:-30}
      # v6.5: 高可用任务租约（秒）
      - APP_HA_TASK_LEASE_SECONDS=${APP_HA_TASK_LEASE_SECONDS:-600}
      # v6.6: 任务 TTL（分钟）与 QUEUED 兜底调度
      - APP_HA_TASK_TTL_MINUTES=${APP_HA_TASK_TTL_MINUTES:-60}
      - APP_HA_DISPATCH_DELAY_MS=${APP_HA_DISPATCH_DELAY_MS:-15000}
      # v6.6: MCP 工具请求超时（秒）
      - APP_MCP_REQUEST_TIMEOUT_SECONDS=${APP_MCP_REQUEST_TIMEOUT_SECONDS:-60}
      # v5.13: tools MCP Server 访问后端桥接接口
      - MCP_BRIDGE_URL=http://backend:8000
      - MCP_BRIDGE_TOKEN=${MCP_BRIDGE_TOKEN:-aicasetest-mcp-local}
      - TZ=Asia/Shanghai
      - JAVA_OPTS=-Xms256m -Xmx2g -Dfile.encoding=UTF-8
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    volumes:
      # 数据与输出持久化
      - ./data:/app/data
      - ./outputs:/app/outputs
      # 待分析项目代码（只读挂载 litemall）
      - E:/java_project/litemall:/app/projects/litemall:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ========== 前端 ==========
  frontend:
    # vP4: 支持本地构建与 GHCR 镜像部署
    image: ${IMAGE_FRONTEND:-aicasetest-frontend}:${IMAGE_TAG:-local}
    pull_policy: ${PULL_POLICY:-missing}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: test-agent-frontend
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 128m
          cpus: "0.5"
    ports:
      - "80:80"
      - "443:443"
    # vP1: 证书目录（entrypoint 会在缺失时生成自签证书）
    volumes:
      - ./certs:/etc/nginx/certs
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ========== vP3: 可观测与告警 ==========
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: aicasetest-prometheus
    restart: unless-stopped
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.1.0
    container_name: aicasetest-grafana
    restart: unless-stopped
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - MYSQL_DATABASE=${MYSQL_DATABASE:-aicasetest}
      - MYSQL_USERNAME=${MYSQL_USERNAME:-aicasetest}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-aicasetest123}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mysql-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
  prometheus-data:
  grafana-data:
