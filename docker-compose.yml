services:
  # ========== v5.0: MySQL 数据库（3308 避开本机 3306/3307） ==========
  mysql:
    image: mysql:8.0
    container_name: aicasetest-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-aicasetest-root}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-aicasetest}
      - MYSQL_USER=${MYSQL_USERNAME:-aicasetest}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-aicasetest123}
      - TZ=Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-aicasetest-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ========== v5.2: Redis 运行态 ==========
  redis:
    image: redis:7-alpine
    container_name: aicasetest-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ========== 后端 ==========
  backend:
    build:
      # 需要仓库根作为上下文，以复制 mcp-server / playwright-mcp-server
      context: .
      dockerfile: backend/Dockerfile
    container_name: test-agent-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-mimo}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-mimo-v2.5-pro}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.xiaomimimo.com/v1}
      - TZ=Asia/Shanghai
      - JAVA_OPTS=-Xms256m -Xmx2g -Dfile.encoding=UTF-8
    volumes:
      # H2 数据库持久化
      - ./data:/app/data
      # XMind 输出文件
      - ./outputs:/app/outputs
      # 待分析项目代码（只读挂载 litemall）
      - E:/java_project/litemall:/app/projects/litemall:ro
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ========== 前端 ==========
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: test-agent-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
